<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InHaus — Inspector Performance</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ── Performance page overrides ─────────────────────────── */
.perf-page { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
.perf-page-title { font-size: 1.3rem; font-weight: 800; color: var(--green); margin-bottom: 4px; }
.perf-page-sub   { font-size: 0.8rem; color: var(--gray-500); margin-bottom: 28px; }

.month-select-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.month-select-row label { font-size: 0.8rem; font-weight: 600; color: var(--gray-600); }
.month-select { padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--gray-200); font-size: 0.85rem; color: var(--gray-900); background: white; }

/* Summary pills */
.perf-summary { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
.perf-pill { background: white; border-radius: 10px; padding: 14px 18px; flex: 1; min-width: 120px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); border: 1.5px solid var(--gray-100); }
.perf-pill-num   { font-size: 1.8rem; font-weight: 800; color: var(--gray-900); line-height: 1; }
.perf-pill-label { font-size: 0.72rem; color: var(--gray-500); margin-top: 4px; }

/* Inspector cards */
.inspector-card {
  background: white; border-radius: 14px; border: 1.5px solid var(--gray-100);
  margin-bottom: 16px; overflow: hidden;
  box-shadow: 0 1px 6px rgba(0,0,0,0.05);
}
.inspector-card-header {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 20px; cursor: pointer;
  border-bottom: 1px solid var(--gray-100);
}
.inspector-card-header:hover { background: var(--gray-50); }
.insp-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; font-weight: 800; color: white; flex-shrink: 0;
}
.insp-info { flex: 1; }
.insp-name  { font-size: 0.95rem; font-weight: 700; color: var(--gray-900); }
.insp-meta  { font-size: 0.72rem; color: var(--gray-500); margin-top: 2px; }
.insp-score-block { text-align: center; min-width: 56px; }
.insp-score-big  { font-size: 2rem; font-weight: 800; line-height: 1; }
.insp-score-grade { font-size: 0.8rem; font-weight: 700; margin-top: 2px; }
.insp-comp { min-width: 70px; text-align: center; }
.insp-comp-val { font-size: 1rem; font-weight: 700; }
.insp-comp-label { font-size: 0.62rem; color: var(--gray-400); margin-top: 2px; }

/* Per-inspection breakdown */
.inspector-jobs { padding: 0 20px 16px; }
.jobs-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.jobs-table th { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-400); padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--gray-100); }
.jobs-table td { font-size: 0.78rem; padding: 8px 8px; border-bottom: 1px solid var(--gray-50); color: var(--gray-700); }
.jobs-table tr:last-child td { border-bottom: none; }
.score-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 700;
}
.chip-a  { background: #dcfce7; color: #166534; }
.chip-b  { background: #dbeafe; color: #1e40af; }
.chip-c  { background: #fef9c3; color: #854d0e; }
.chip-d  { background: #fff7ed; color: #9a3412; }
.chip-f  { background: #fee2e2; color: #991b1b; }
.chip-na { background: var(--gray-100); color: var(--gray-500); }
.trend-up   { color: #16a34a; font-weight: 700; }
.trend-down { color: #dc2626; font-weight: 700; }
.trend-flat { color: var(--gray-400); }

/* Grade colors */
.green-score { color: #16a34a; }
.blue-score  { color: #3b82f6; }
.amber-score { color: #d97706; }
.orange-score{ color: #ea580c; }
.red-score   { color: #dc2626; }
.green-bg    { background: #16a34a; }
.blue-bg     { background: #3b82f6; }
.amber-bg    { background: #d97706; }
.red-bg      { background: #dc2626; }

.comp-pos    { color: #16a34a; }
.comp-neg    { color: #dc2626; }
.comp-base   { color: var(--gray-500); }
.comp-pip    { color: #dc2626; font-weight: 700; }

.toggle-icon { color: var(--gray-400); font-size: 0.8rem; margin-left: auto; transition: transform 0.2s; }
.expanded .toggle-icon { transform: rotate(180deg); }

/* Loading / empty */
.perf-loading { text-align: center; padding: 40px; color: var(--gray-400); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="perf-page">

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
    <a href="index.html" style="font-size:0.8rem;color:var(--green);text-decoration:none">← Dashboard</a>
  </div>
  <div class="perf-page-title">🏆 Inspector Performance</div>
  <div class="perf-page-sub">Scores are calculated from photo placement, observations, actions taken, and checklist completion.</div>

  <div class="month-select-row">
    <label>Month:</label>
    <select class="month-select" id="month-select">
      <option value="2026-06">June 2026</option>
      <option value="2026-05">May 2026</option>
      <option value="2026-04">April 2026</option>
    </select>
    <label>Inspector:</label>
    <select class="month-select" id="inspector-select">
      <option value="all">All Inspectors</option>
    </select>
  </div>

  <div class="perf-summary" id="perf-summary">
    <div class="perf-pill"><div class="perf-pill-num" id="sum-jobs">—</div><div class="perf-pill-label">Inspections</div></div>
    <div class="perf-pill"><div class="perf-pill-num" id="sum-avg">—</div><div class="perf-pill-label">Avg Score</div></div>
    <div class="perf-pill"><div class="perf-pill-num" id="sum-aplus">—</div><div class="perf-pill-label">A / A+ Scores</div></div>
    <div class="perf-pill"><div class="perf-pill-num" id="sum-failing">—</div><div class="perf-pill-label">Below 65</div></div>
  </div>

  <div id="inspector-list">
    <div class="perf-loading">Loading inspections…</div>
  </div>

</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsRP4-RBAuldMh_BkNlbAkZyMLDz8ohNM1WwIRfB1ROz9JHGYjYsZdVNbgy98-d4gu8Q/exec';
const ACCESS_TOKEN    = '***';
const IS_DEMO = (APPS_SCRIPT_URL === 'PLACEHOLDER_URL');

function gradeFromScore(s) {
  if (s >= 95) return { grade: 'A+', cls: 'green-score',  chipCls: 'chip-a',  bgCls: 'green-bg' };
  if (s >= 85) return { grade: 'A',  cls: 'green-score',  chipCls: 'chip-a',  bgCls: 'green-bg' };
  if (s >= 75) return { grade: 'B',  cls: 'blue-score',   chipCls: 'chip-b',  bgCls: 'blue-bg'  };
  if (s >= 65) return { grade: 'C',  cls: 'amber-score',  chipCls: 'chip-c',  bgCls: 'amber-bg' };
  if (s >= 50) return { grade: 'D',  cls: 'orange-score', chipCls: 'chip-d',  bgCls: 'amber-bg' };
  return               { grade: 'F',  cls: 'red-score',    chipCls: 'chip-f',  bgCls: 'red-bg'   };
}

function compFromAvg(avg) {
  if (avg >= 90) return { label: '+5%',  cls: 'comp-pos' };
  if (avg >= 80) return { label: '+2%',  cls: 'comp-pos' };
  if (avg >= 70) return { label: 'Base', cls: 'comp-base' };
  if (avg >= 60) return { label: '−2%',  cls: 'comp-neg' };
  return               { label: 'PIP',   cls: 'comp-pip' };
}

function initials(name) {
  return (name || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
}

// DEMO data — replaced by real API data when available
const DEMO_INSPECTIONS = [
  { id:'INH-20260422-C7KYGW', address:'301 Cemetery Rd, Basalt',    inspector:'Dave Kline',  date:'2026-04-22', completionScore:91,  completionGrade:'A',  photos:14, status:'Report Complete' },
  { id:'INH-20260428-DKNSOB', address:'Alpha One Ranch',            inspector:'Dave Kline',  date:'2026-04-28', completionScore:87,  completionGrade:'A',  photos:57, status:'Submitted to Tanner' },
  { id:'INH-20260506-DV4MDG', address:'Sunshine Ranch',             inspector:'Dave Kline',  date:'2026-05-06', completionScore:78,  completionGrade:'B',  photos:8,  status:'Submitted to Tanner' },
  { id:'INH-20260520-EAYNCM', address:'Meadow Barn Ranch',          inspector:'Dave Kline',  date:'2026-05-20', completionScore:94,  completionGrade:'A+', photos:0,  status:'In Review' },
  { id:'INH-20260529-Y0F0KO', address:'12 Elk Trail, Carbondale',   inspector:'Dave Kline',  date:'2026-05-29', completionScore:63,  completionGrade:'C',  photos:0,  status:'In Review' },
  { id:'INH-20260601-S0YI8K', address:'88 Aspen Way, Aspen',        inspector:'Dave Kline',  date:'2026-06-01', completionScore:41,  completionGrade:'F',  photos:0,  status:'In Review' },
];

function buildPerformancePage(inspections, filterMonth, filterInspector) {
  // Filter
  let filtered = inspections.filter(insp => {
    const matchMonth    = !filterMonth    || insp.date.startsWith(filterMonth);
    const matchInspector = !filterInspector || filterInspector === 'all' || insp.inspector === filterInspector;
    return matchMonth && matchInspector;
  });

  // Group by inspector
  const byInspector = {};
  filtered.forEach(insp => {
    if (!byInspector[insp.inspector]) byInspector[insp.inspector] = [];
    byInspector[insp.inspector].push(insp);
  });

  // Summary pills
  const allScores = filtered.filter(i => i.completionScore != null).map(i => i.completionScore);
  const avgScore  = allScores.length ? Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length) : null;
  document.getElementById('sum-jobs').textContent    = filtered.length;
  document.getElementById('sum-avg').textContent     = avgScore != null ? avgScore : '—';
  document.getElementById('sum-aplus').textContent   = allScores.filter(s => s >= 85).length;
  document.getElementById('sum-failing').textContent = allScores.filter(s => s < 65).length;

  // Inspector select options
  const inspSel = document.getElementById('inspector-select');
  const names = [...new Set(inspections.map(i => i.inspector))].sort();
  inspSel.innerHTML = '<option value="all">All Inspectors</option>';
  names.forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    if (n === filterInspector) o.selected = true;
    inspSel.appendChild(o);
  });

  // Build cards
  const list = document.getElementById('inspector-list');
  list.innerHTML = '';

  if (Object.keys(byInspector).length === 0) {
    list.innerHTML = '<div class="perf-loading">No inspections found for this period.</div>';
    return;
  }

  Object.entries(byInspector).sort((a,b) => {
    const avgA = a[1].filter(i=>i.completionScore!=null).reduce((s,i)=>s+i.completionScore,0) / (a[1].filter(i=>i.completionScore!=null).length||1);
    const avgB = b[1].filter(i=>i.completionScore!=null).reduce((s,i)=>s+i.completionScore,0) / (b[1].filter(i=>i.completionScore!=null).length||1);
    return avgB - avgA;
  }).forEach(([name, jobs]) => {
    const scores  = jobs.filter(j=>j.completionScore!=null).map(j=>j.completionScore);
    const avg     = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
    const g       = avg != null ? gradeFromScore(avg) : { grade:'—', cls:'comp-base', chipCls:'chip-na', bgCls:'green-bg' };
    const comp    = avg != null ? compFromAvg(avg) : { label:'—', cls:'comp-base' };

    const card = document.createElement('div');
    card.className = 'inspector-card';

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'inspector-card-header';

    const avatar = document.createElement('div');
    avatar.className = `insp-avatar ${g.bgCls}`;
    avatar.textContent = initials(name);

    const info = document.createElement('div');
    info.className = 'insp-info';
    info.innerHTML = `<div class="insp-name">${name}</div><div class="insp-meta">${jobs.length} inspection${jobs.length!==1?'s':''} · ${scores.length} scored</div>`;

    const scoreBlock = document.createElement('div');
    scoreBlock.className = 'insp-score-block';
    scoreBlock.innerHTML = avg != null
      ? `<div class="insp-score-big ${g.cls}">${avg}</div><div class="insp-score-grade ${g.cls}">${g.grade}</div>`
      : `<div class="insp-score-big comp-base">—</div><div class="insp-score-grade comp-base">N/A</div>`;

    const compBlock = document.createElement('div');
    compBlock.className = 'insp-comp';
    compBlock.innerHTML = `<div class="insp-comp-val ${comp.cls}">${comp.label}</div><div class="insp-comp-label">Comp adj</div>`;

    const toggle = document.createElement('div');
    toggle.className = 'toggle-icon';
    toggle.textContent = '▼';

    hdr.append(avatar, info, scoreBlock, compBlock, toggle);

    // Jobs table
    const jobsDiv = document.createElement('div');
    jobsDiv.className = 'inspector-jobs';
    jobsDiv.style.display = 'none';

    const table = document.createElement('table');
    table.className = 'jobs-table';
    table.innerHTML = `<thead><tr><th>Property</th><th>Date</th><th>Score</th><th>Photos</th><th>Status</th></tr></thead>`;
    const tbody = document.createElement('tbody');

    jobs.sort((a,b)=>b.date.localeCompare(a.date)).forEach(job => {
      const jg = job.completionScore != null ? gradeFromScore(job.completionScore) : null;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><a href="review.html?id=${job.id}&token=InHaus2026" style="color:var(--green);text-decoration:none;font-weight:600">${job.address}</a></td>
        <td>${new Date(job.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td>
        <td>${jg ? `<span class="score-chip ${jg.chipCls}">${job.completionScore} ${jg.grade}</span>` : '<span class="score-chip chip-na">Not scored</span>'}</td>
        <td>${job.photos ?? '—'}</td>
        <td style="color:var(--gray-500)">${job.status||'—'}</td>`;
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    jobsDiv.appendChild(table);

    // Toggle
    hdr.addEventListener('click', () => {
      const open = jobsDiv.style.display !== 'none';
      jobsDiv.style.display = open ? 'none' : 'block';
      hdr.classList.toggle('expanded', !open);
    });

    card.append(hdr, jobsDiv);
    list.appendChild(card);
  });
}

// Load and render
async function loadPerformance() {
  const monthSel = document.getElementById('month-select');
  const inspSel  = document.getElementById('inspector-select');

  let inspections = [];

  if (IS_DEMO) {
    inspections = DEMO_INSPECTIONS;
  } else {
    try {
      const resp = await fetch(`${APPS_SCRIPT_URL}?action=listAll&token=${ACCESS_TOKEN}`);
      const data = await resp.json();
      inspections = (data.inspections || []).map(i => ({
        id:               i.id || i.inspectionId,
        address:          i.propertyAddress || i.address,
        inspector:        i.inspectorName   || i.inspector,
        date:             (i.inspectionDate || i.date || '').slice(0,10),
        completionScore:  i.completionScore ?? null,
        completionGrade:  i.completionGrade ?? null,
        photos:           (i.photos || []).length,
        status:           i.status
      }));
    } catch(e) {
      // Fall back to static list.json
      try {
        const r2 = await fetch('./api/list.json');
        const d2 = await r2.json();
        inspections = (d2.inspections || d2 || []).map(i => ({
          id:              i.id || i.inspectionId,
          address:         i.propertyAddress || i.address,
          inspector:       i.inspectorName   || i.inspector || 'Unknown',
          date:            (i.inspectionDate || i.date || '').slice(0,10),
          completionScore: i.completionScore ?? null,
          completionGrade: i.completionGrade ?? null,
          photos:          i.photoCount ?? 0,
          status:          i.status
        }));
      } catch(e2) {
        inspections = DEMO_INSPECTIONS;
      }
    }
  }

  const render = () => buildPerformancePage(inspections, monthSel.value, inspSel.value);
  monthSel.addEventListener('change', render);
  inspSel.addEventListener('change', render);
  render();
}

loadPerformance();
</script>
</body>
</html>
